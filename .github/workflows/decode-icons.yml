name: decode-icons
on:
  push:
    paths: ["icons/*.b64"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in icons/*.b64; do base64 -d "$f" > "${f%.b64}"; done
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add icons/*.png
          git diff --cached --quiet || git commit -m "Decode icons"
          git push
